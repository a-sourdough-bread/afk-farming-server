<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bloxd.io Window</title>
  <style>
    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* Fixed window dimensions */
    .game-container {
      width: 1800px;
      height: 900px;
      border: 3px solid #333;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <iframe 
      src="https://bloxd.io/" 
      allow="gamepad; autoplay; pointer-lock"
      sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms">
    </iframe>
  </div>

</body>
</html>
